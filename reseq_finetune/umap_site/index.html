<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MC38 · reseq UMAP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0e1418;
      --paper: #e8eef1;
      --mist: #9eb0b8;
      --teal: #1f8a7a;
      --glow: rgba(31, 138, 122, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Sora", sans-serif;
      color: var(--paper);
      background:
        radial-gradient(1200px 700px at 12% -10%, rgba(31,138,122,0.22), transparent 55%),
        radial-gradient(900px 600px at 100% 20%, rgba(180, 110, 60, 0.12), transparent 50%),
        linear-gradient(165deg, #0b1014 0%, #121a20 45%, #0e1519 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .hero {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(240px, 320px) 1fr;
      gap: 0;
      align-items: stretch;
    }
    .copy {
      padding: clamp(1.5rem, 4vw, 3rem) clamp(1.2rem, 3vw, 2.2rem);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.1rem;
      border-right: 1px solid rgba(232,238,241,0.08);
      position: relative;
      z-index: 2;
    }
    .brand {
      font-family: "Instrument Serif", serif;
      font-size: clamp(3.4rem, 8vw, 5.2rem);
      line-height: 0.9;
      letter-spacing: -0.03em;
      color: var(--paper);
      opacity: 0;
      animation: rise 0.9s ease forwards 0.1s;
    }
    .brand span {
      display: block;
      font-size: 0.28em;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-family: "Sora", sans-serif;
      font-weight: 500;
      color: var(--teal);
      margin-bottom: 0.7rem;
    }
    h1 {
      font-family: "Instrument Serif", serif;
      font-weight: 400;
      font-size: clamp(1.35rem, 2.4vw, 1.75rem);
      line-height: 1.25;
      color: var(--paper);
      max-width: 16ch;
      opacity: 0;
      animation: rise 0.9s ease forwards 0.25s;
    }
    .lede {
      color: var(--mist);
      font-size: 0.92rem;
      line-height: 1.55;
      max-width: 28ch;
      opacity: 0;
      animation: rise 0.9s ease forwards 0.4s;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin-top: 0.4rem;
      opacity: 0;
      animation: rise 0.9s ease forwards 0.55s;
    }
    .chip {
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      padding: 0.35rem 0.65rem;
      border: 1px solid rgba(232,238,241,0.14);
      color: var(--paper);
      background: rgba(255,255,255,0.03);
    }
    .viz {
      position: relative;
      min-height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      opacity: 0;
      animation: fade 1.1s ease forwards 0.35s;
    }
    canvas#umap {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 1.25rem 1.1rem;
      background: linear-gradient(to top, rgba(8,12,15,0.9), transparent);
    }
    .toggles {
      display: flex;
      gap: 0.4rem;
    }
    button {
      font-family: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--mist);
      background: transparent;
      border: 1px solid rgba(232,238,241,0.16);
      padding: 0.45rem 0.8rem;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    button.active, button:hover {
      color: var(--paper);
      border-color: var(--teal);
      background: rgba(31,138,122,0.12);
    }
    .tip {
      font-size: 0.78rem;
      color: var(--mist);
      min-height: 1.2em;
    }
    .legend {
      position: absolute;
      right: 1rem;
      top: 1rem;
      max-height: calc(100% - 5rem);
      overflow: auto;
      padding: 0.6rem 0.75rem;
      background: rgba(10,14,18,0.55);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(232,238,241,0.08);
      font-size: 0.72rem;
      line-height: 1.35;
      max-width: 220px;
    }
    .legend h2 {
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mist);
      font-weight: 500;
      margin-bottom: 0.45rem;
    }
    .legend button.item {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--paper);
      padding: 0.18rem 0;
      text-transform: none;
      letter-spacing: 0;
      font-size: 0.72rem;
      opacity: 0.95;
    }
    .legend button.item.off { opacity: 0.28; }
    .swatch {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 1px;
      flex: 0 0 auto;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.12);
    }
    .count { color: var(--mist); margin-left: auto; font-variant-numeric: tabular-nums; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; min-height: auto; }
      .copy {
        border-right: 0;
        border-bottom: 1px solid rgba(232,238,241,0.08);
        padding-bottom: 1.5rem;
      }
      .viz { min-height: 72vh; }
      .legend { max-height: 40%; font-size: 0.68rem; }
      h1 { max-width: none; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <aside class="copy">
      <div class="brand"><span>Lee Lab · XYZeq</span>MC38</div>
      <h1>Resequenced tumor atlas, labeled.</h1>
      <p class="lede">Harmony-corrected UMAP of E14S + deep-reseq E15S — 14,459 cells with transferred and kNN-refined annotations.</p>
      <div class="meta">
        <span class="chip" id="nCells">14,459 cells</span>
        <span class="chip" id="nTypes">21 types</span>
        <span class="chip">E14S + E15S</span>
      </div>
    </aside>
    <section class="viz">
      <canvas id="umap"></canvas>
      <div class="legend" id="legend"></div>
      <div class="toolbar">
        <div class="toggles">
          <button type="button" class="active" data-mode="cell_type">Cell type</button>
          <button type="button" data-mode="sample">Library</button>
        </div>
        <div class="tip" id="tip">Hover a point · click legend to isolate</div>
      </div>
    </section>
  </main>
  <script>
    const canvas = document.getElementById('umap');
    const ctx = canvas.getContext('2d', { alpha: false });
    const tip = document.getElementById('tip');
    const legend = document.getElementById('legend');
    let data = null;
    let mode = 'cell_type';
    let hidden = new Set();
    let dpr = 1;
    let layout = { x0: 0, y0: 0, sx: 1, sy: 1 };
    let hover = -1;

    const sampleColors = { E14S: '#4aa3c3', E15S: '#d45b4a' };

    async function boot() {
      data = await fetch('umap_data.json').then(r => r.json());
      document.getElementById('nCells').textContent = data.n.toLocaleString() + ' cells';
      document.getElementById('nTypes').textContent = data.order.length + ' types';
      buildLegend();
      resize();
      requestAnimationFrame(draw);
    }

    function buildLegend() {
      legend.innerHTML = '<h2>Cell type</h2>';
      data.order.forEach(lab => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'item';
        b.dataset.label = lab;
        b.innerHTML = `<span class="swatch" style="background:${data.colors[lab]}"></span><span>${lab}</span><span class="count">${data.counts[lab]}</span>`;
        b.addEventListener('click', () => {
          if (hidden.has(lab)) hidden.delete(lab); else hidden.add(lab);
          b.classList.toggle('off', hidden.has(lab));
          draw();
        });
        legend.appendChild(b);
      });
    }

    function colorFor(i) {
      if (mode === 'sample') return sampleColors[data.sample[i]] || '#aaa';
      const lab = data.cell_type[i];
      if (hidden.has(lab)) return null;
      return data.colors[lab];
    }

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const toolbarH = 56;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor((rect.height - toolbarH) * dpr);
      canvas.style.width = rect.width + 'px';
      canvas.style.height = (rect.height - toolbarH) + 'px';
      computeLayout();
      draw();
    }

    function computeLayout() {
      if (!data) return;
      const pad = 28 * dpr;
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (let i = 0; i < data.n; i++) {
        minX = Math.min(minX, data.umap1[i]);
        maxX = Math.max(maxX, data.umap1[i]);
        minY = Math.min(minY, data.umap2[i]);
        maxY = Math.max(maxY, data.umap2[i]);
      }
      const w = canvas.width - pad * 2;
      const h = canvas.height - pad * 2;
      const sx = w / (maxX - minX || 1);
      const sy = h / (maxY - minY || 1);
      const s = Math.min(sx, sy);
      layout = {
        x0: pad + (w - s * (maxX - minX)) / 2 - minX * s,
        y0: pad + (h - s * (maxY - minY)) / 2 + maxY * s,
        s,
      };
    }

    function toXY(i) {
      return [
        layout.x0 + data.umap1[i] * layout.s,
        layout.y0 - data.umap2[i] * layout.s,
      ];
    }

    function draw() {
      if (!data) return;
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = '#0d1317';
      ctx.fillRect(0, 0, w, h);
      // soft vignette
      const g = ctx.createRadialGradient(w*0.55, h*0.45, 0, w*0.55, h*0.45, Math.max(w,h)*0.7);
      g.addColorStop(0, 'rgba(31,138,122,0.07)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      const r = Math.max(1.2, 1.6 * dpr);
      for (let i = 0; i < data.n; i++) {
        const c = colorFor(i);
        if (!c) continue;
        const [x, y] = toXY(i);
        ctx.fillStyle = c;
        ctx.globalAlpha = 0.82;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (hover >= 0 && colorFor(hover)) {
        const [x, y] = toXY(hover);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5 * dpr;
        ctx.beginPath();
        ctx.arc(x, y, r * 2.4, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function nearest(mx, my) {
      let best = -1, bestD = 12 * dpr;
      for (let i = 0; i < data.n; i++) {
        if (!colorFor(i)) continue;
        const [x, y] = toXY(i);
        const d = Math.hypot(x - mx, y - my);
        if (d < bestD) { bestD = d; best = i; }
      }
      return best;
    }

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * dpr;
      const my = (e.clientY - rect.top) * dpr;
      const i = nearest(mx, my);
      hover = i;
      if (i < 0) tip.textContent = 'Hover a point · click legend to isolate';
      else tip.textContent = `${data.cell_type[i]} · ${data.sample[i]}`;
      draw();
    });

    document.querySelectorAll('.toggles button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.toggles button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mode = btn.dataset.mode;
        legend.style.display = mode === 'cell_type' ? 'block' : 'none';
        draw();
      });
    });

    window.addEventListener('resize', resize);
    boot();
  </script>
</body>
</html>
